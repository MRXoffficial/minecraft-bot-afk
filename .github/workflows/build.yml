name: Build APK with Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            uuid-dev \
            ant \
            autoconf \
            libtool \
            openjdk-17-jdk \
            unzip \
            libstdc++6 \
            libglu1-mesa \
            zlib1g \
            adb \
            autopoint

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==3.0.10 buildozer==1.5.0

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
