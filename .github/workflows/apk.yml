name: APK derle

on:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasorunu belirle
        run: |
          if [ -f package.json ]; then
            echo "PROJE=." >> "$GITHUB_ENV"
          elif [ -f afk-bot-apk-projesi.zip ]; then
            unzip -q afk-bot-apk-projesi.zip
            echo "PROJE=afk-bot-apk" >> "$GITHUB_ENV"
          elif [ -d afk-bot-apk ]; then
            echo "PROJE=afk-bot-apk" >> "$GITHUB_ENV"
          else
            echo "Proje dosyalari bulunamadi (package.json yok)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        working-directory: ${{ env.PROJE }}
        run: npm install

      - name: Node projesi bagimliliklari (mineflayer)
        working-directory: ${{ env.PROJE }}
        run: npm run node:kur

      - name: Gereksiz dosyalari temizle (Android cakismasini onler)
        working-directory: ${{ env.PROJE }}
        run: |
          find static/nodejs/node_modules -type d \( -name sample -o -name samples -o -name test -o -name tests -o -name __tests__ -o -name example -o -name examples -o -name docs \) -prune -exec rm -rf {} +
          find static/nodejs/node_modules -name '*.gz' | while read f; do [ -e "${f%.gz}" ] && rm -f "$f"; done
          echo "Temizlik tamam"

      - name: Kodu karistir ve arayuzu derle
        working-directory: ${{ env.PROJE }}
        run: OBF_ZORUNLU=1 npm run hazirla

      - name: Android projesini olustur ve eklentileri koy
        working-directory: ${{ env.PROJE }}
        run: npm run android:ekle

      - name: Senkronla
        working-directory: ${{ env.PROJE }}
        run: npx cap sync android

      - name: APK derle
        working-directory: ${{ env.PROJE }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: afk-bot-apk
          path: ${{ env.PROJE }}/android/app/build/outputs/apk/debug/app-debug.apk
